name: CI

# ─────────────────────────────────────────────────────────────────────────────
#  NetSentry — Continuous Integration
#  Runs on every push and pull request to main.
#  Three parallel jobs: C++ engine · Node.js API · React frontend.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run if a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  #  JOB 1 — Build the C++ DPI engine with CMake
  # ───────────────────────────────────────────────────────────────────────────
  cpp-engine:
    name: C++ Engine (CMake)
    runs-on: ubuntu-latest
    steps:
      # Pull the repo onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # libpcap headers — needed only when building with -DWITH_PCAP=ON.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpcap-dev

      # Configure with CMake. Release build, libpcap enabled.
      - name: Configure (CMake)
        working-directory: cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_PCAP=ON

      # Compile using all available cores.
      - name: Build
        working-directory: cpp
        run: cmake --build build -j$(nproc)

      # Smoke test — run the binary in simulation mode for 2 seconds and
      # confirm it emits valid JSON alert lines on stdout. `timeout` exits 124
      # when it kills the process, which is the expected success path here.
      - name: Smoke test (simulation mode)
        working-directory: cpp
        run: |
          echo "Running engine for 2s to verify it produces JSON output..."
          timeout 2s ./build/netsentry --sim > out.log 2>&1 || true
          if grep -q '"type":"alert"' out.log; then
            echo "✓ Engine emitted alert JSON"
          else
            echo "✗ No alert JSON found in output"
            cat out.log
            exit 1
          fi

      # Run GoogleTest unit tests IF they exist. This block is a no-op until
      # you add tests (roadmap item), so the job stays green in the meantime.
      - name: Unit tests (if present)
        working-directory: cpp
        run: |
          if [ -f build/netsentry_tests ]; then
            echo "Running unit tests..."
            ./build/netsentry_tests
          else
            echo "No test binary found — skipping (add GoogleTest to enable)."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  #  JOB 2 — Lint and test the Node.js API
  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: Node.js API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 with npm cache keyed on the API lockfile for faster installs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      # Install dependencies. `npm ci` is the CI-safe install — it respects the
      # lockfile exactly and fails if package.json and the lockfile disagree.
      # Falls back to `npm install` if no lockfile is committed yet.
      - name: Install dependencies
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Syntax check — `node --check` parses server.js without running it.
      # Catches typos and syntax errors. Always available, no config needed.
      - name: Syntax check
        working-directory: api
        run: node --check server.js

      # Run lint IF an "lint" script is defined in package.json. No-op otherwise.
      - name: Lint (if configured)
        working-directory: api
        run: |
          if npm run | grep -q "^  lint"; then
            npm run lint
          else
            echo "No lint script in package.json — skipping."
          fi

      # Run tests IF a "test" script is defined and is not the npm default.
      - name: Test (if configured)
        working-directory: api
        run: |
          if npm run | grep -q "^  test"; then
            npm test
          else
            echo "No test script in package.json — skipping (add Jest to enable)."
          fi

      # Boot the server, hit /api/health, confirm it responds. This proves the
      # API actually starts and serves — a real integration check.
      - name: Health check (boot + curl)
        working-directory: api
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Started API (pid $SERVER_PID), waiting for it to bind..."
          sleep 3
          if curl -sf http://localhost:3001/api/health | grep -q '"status":"ok"'; then
            echo "✓ API health check passed"
          else
            echo "✗ API health check failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          kill $SERVER_PID 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  #  JOB 3 — Build the React (Vite) frontend
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: React Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Lint if configured (no-op otherwise).
      - name: Lint (if configured)
        working-directory: frontend
        run: |
          if npm run | grep -q "^  lint"; then
            npm run lint
          else
            echo "No lint script — skipping."
          fi

      # The real check — a production Vite build. Fails on any import error,
      # broken JSX, or missing dependency. Build env vars point at the live API
      # so the bundle is valid; they can be overridden at deploy time.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://netsentry-api.onrender.com
          VITE_WS_URL: wss://netsentry-api.onrender.com
        run: npm run build

      # Confirm the build actually produced output.
      - name: Verify build output
        working-directory: frontend
        run: |
          if [ -d dist ] && [ -f dist/index.html ]; then
            echo "✓ Build produced dist/index.html"
            ls -lh dist
          else
            echo "✗ Build did not produce dist/index.html"
            exit 1
          fi

      # Upload the build as a downloadable artifact (handy for debugging,
      # and proves the build is real). Retained for 7 days.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  #  JOB 4 — Aggregate gate. Passes only if all three jobs above pass.
  #  Use this as the required status check for branch protection.
  # ───────────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [ cpp-engine, api, frontend ]
    steps:
      - name: All checks passed
        run: echo "✓ All CI jobs passed — safe to merge."
